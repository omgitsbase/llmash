name: macos

on:
  push:
    branches: [main, mac]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        continue-on-error: true
        run: cmake --build build -j 3 -- -k 2>&1 | tee build.log

      - name: test
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure 2>&1 | tee test.log

      - name: summary
        if: always()
        run: |
          echo '### errors' >> $GITHUB_STEP_SUMMARY
          grep -E "error:" build.log 2>/dev/null | sed 's|.*/cpp/src/||' | sort -u | head -40 >> $GITHUB_STEP_SUMMARY || echo none >> $GITHUB_STEP_SUMMARY
          echo '### tests' >> $GITHUB_STEP_SUMMARY
          tail -12 test.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
